<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" preserveAspectRatio="xMidYMid slice">
  <title>Placa de ambiente — hero</title>
  <defs>
    <radialGradient id="glow" cx="0.66" cy="0.48" r="0.62">
      <stop offset="0%"   stop-color="#9C7331" stop-opacity="0.95"/>
      <stop offset="34%"  stop-color="#513A17" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#0B0908" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F3E2B8" stop-opacity="0.9"/>
      <stop offset="34%"  stop-color="#C9A968" stop-opacity="0.6"/>
      <stop offset="66%"  stop-color="#7C5B27" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#E5CD9A" stop-opacity="0.76"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%"   stop-color="#8A6A2E"/>
      <stop offset="30%"  stop-color="#F1DFB4"/>
      <stop offset="62%"  stop-color="#B08E4C"/>
      <stop offset="100%" stop-color="#E3C88A"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#C9A968" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C9A968" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>

  <rect width="1600" height="1200" fill="#0B0908"/>
  <rect width="1600" height="1200" fill="url(#glow)"/>

  <!-- humo -->
  <g opacity="0.5" filter="url(#soft)">
    <ellipse cx="1010" cy="470" rx="290" ry="200" fill="#E3C88A" opacity="0.24"/>
    <ellipse cx="1240" cy="700" rx="240" ry="150" fill="#B0803A" opacity="0.3"/>
    <ellipse cx="840"  cy="790" rx="200" ry="130" fill="#7C5B27" opacity="0.26"/>
  </g>

  <!-- reflejo en la superficie -->
  <ellipse cx="1060" cy="1005" rx="215" ry="24" fill="url(#floor)"/>

  <!-- frasco -->
  <g transform="translate(1060,640) scale(0.78) translate(-300,-375)">
    <path fill="url(#glass)" stroke="#E9D6A8" stroke-opacity="0.42" stroke-width="2"
          d="M 260 90 H 340 V 190 H 315 V 232 C 315 240, 330 244, 348 252
             C 378 265, 392 292, 392 330 V 590 C 392 622, 372 645, 340 645
             H 260 C 228 645, 208 622, 208 590 V 330
             C 208 292, 222 265, 252 252 C 270 244, 285 240, 285 232 V 190 H 260 Z"/>
    <rect x="256" y="86" width="88" height="108" rx="4" fill="url(#cap)"/>
    <rect x="248" y="176" width="104" height="16" rx="3" fill="url(#cap)"/>
    <path d="M 236 320 C 236 288, 250 274, 268 268 L 268 612 C 250 606, 236 592, 236 566 Z"
          fill="#FFF6DF" opacity="0.26"/>
    <rect x="252" y="392" width="96" height="1.5" fill="#F1DFB4" opacity="0.45"/>
    <rect x="252" y="470" width="96" height="1.5" fill="#F1DFB4" opacity="0.3"/>
  </g>

  <!-- partículas -->
  <g fill="#F1DFB4">
    <circle cx="470"  cy="330" r="2.2" opacity="0.5"/><circle cx="1330" cy="400" r="1.8" opacity="0.42"/>
    <circle cx="1420" cy="780" r="2.6" opacity="0.36"/><circle cx="380"  cy="720" r="1.6" opacity="0.45"/>
    <circle cx="1180" cy="250" r="1.4" opacity="0.4"/> <circle cx="700"  cy="200" r="2"   opacity="0.32"/>
    <circle cx="1500" cy="560" r="1.8" opacity="0.28"/><circle cx="280"  cy="500" r="1.5" opacity="0.32"/>
    <circle cx="890"  cy="950" r="1.7" opacity="0.3"/> <circle cx="1290" cy="960" r="1.4" opacity="0.26"/>
  </g>

  <rect width="1600" height="1200" filter="url(#grain)" opacity="0.055"/>
</svg>
